<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Christmas Market Finder</title>
<meta name="description" content="Christmas Market Finder by The Traveling Taste – markets around Luxembourg, Germany and France.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* Layout: light winter page with Christmas red and pine green. Candy-cane ribbon on top, search panel, results split into
   "only a few days" and "open all season", month calendar, weekend routes, suggestion band. One column on phones.
   Cards read like market-stall signs: a tinted header (red for short runs, green for all season) over a pale-mint body. */
:root {
  --bg: #1F3D2B;         /* deep pine ground */
  --on-bg: #F2F7F3; --on-bg-soft: #BCD3C3; --on-bg-red: #FFB3B9; --on-bg-green: #A6E3BE; --bg-line: #3A5C47;
  --surface: #E3EFE6;    /* soft mint cards and panels */
  --surface-2: #D2E5D8; --line: #A8C6B2;
  --ink: #12261A; --ink-soft: #46604F;
  --red: #B8222E; --red-ink: #A11C27; --red-soft: #F1CDD0;
  --green: #1E6B43; --green-ink: #185A37; --green-soft: #BFDACA;
  --gold-ink: #7A4F00; --gold-soft: #FBEBC5;
  --on-accent: #FFFFFF; --sel-bg: #FBE3E4;
  --shadow: 0 1px 2px rgba(18, 38, 26, .06), 0 8px 22px rgba(18, 38, 26, .08);
  --display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--on-bg); font: 16px/1.5 var(--body); }
a { color: var(--green-ink); }
a:hover { color: var(--red-ink); }
footer a:hover { color: var(--on-bg); }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.ribbon { height: 8px; background: repeating-linear-gradient(135deg, var(--red) 0 14px, var(--surface) 14px 18px, var(--green) 18px 32px, var(--surface) 32px 36px); }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { padding-block: 18px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
.brand { display: flex; flex-direction: column; text-decoration: none; color: var(--on-bg); }
.brand b { font: 400 26px/1.1 var(--display); }
.brand span { font-size: 13px; color: var(--on-bg-soft); letter-spacing: .03em; }
.head-right { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.ig { font-weight: 600; font-size: 14px; text-decoration: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 10px 14px; color: var(--ink); }
.ig:hover { border-color: var(--green); color: var(--green-ink); }
.langs { display: flex; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; overflow: hidden; }
.langs button { background: transparent; color: var(--ink); border: 0; padding: 10px 13px; min-width: 44px; font: 600 14px var(--body); cursor: pointer; }
.langs button[aria-pressed="true"] { background: var(--red); color: var(--on-accent); }
.hero { padding-block: 26px 8px; display: flex; flex-direction: column; gap: 12px; }
.eyebrow { margin: 0; color: var(--on-bg-green); font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
h1 { margin: 0; font: 400 clamp(36px, 6vw, 64px)/1.03 var(--display); text-wrap: balance; max-width: 18ch; }
h1 em { font-style: italic; color: #FF6170; }
.lede { margin: 0; color: var(--on-bg-soft); max-width: 60ch; font-size: 17px; }
.panel { color: var(--ink); margin-top: 18px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.quick { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 10px 16px; font: 500 15px var(--body); cursor: pointer; min-height: 44px; }
.chip:hover { border-color: var(--green); }
.chip[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--on-accent); font-weight: 600; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-size: 13px; font-weight: 600; color: var(--ink-soft); }
input, select { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font: 16px var(--body); width: 100%; min-width: 0; max-width: 100%; }
/* iOS Safari gives date inputs an intrinsic min width that ignores width:100%,
   so the field spilled past the panel (portrait) and over the next field (landscape). */
input[type="date"] { display: block; min-height: 48px; }
@supports (-webkit-touch-callout: none) {
  input[type="date"] { -webkit-appearance: none; appearance: none; line-height: 22px; }
  input[type="date"]::-webkit-date-and-time-value { text-align: left; }
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.checks { border: 0; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 8px 18px; }
.checks label { display: flex; gap: 8px; align-items: center; font-size: 15px; cursor: pointer; min-height: 32px; }
.checks input { width: 18px; height: 18px; accent-color: var(--green); }
section { padding-block: 30px; }
.sec-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
h2 { margin: 0; font: 400 clamp(28px, 4vw, 38px)/1.1 var(--display); text-wrap: balance; }
.count { margin: 0; color: var(--on-bg-soft); font-size: 15px; font-variant-numeric: tabular-nums; }
.group { display: flex; flex-direction: column; gap: 12px; }
.group + .group { margin-top: 28px; }
.group-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.group-h h3 { margin: 0; font: 700 13px var(--body); letter-spacing: .12em; text-transform: uppercase; }
.group-h.short h3 { color: var(--on-bg-red); }
.group-h.season h3 { color: var(--on-bg-green); }
.group-h p { margin: 0; color: var(--on-bg-soft); font-size: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
@media (max-width: 420px) { .grid { grid-template-columns: 1fr; } }
.card { color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; overflow: hidden; box-shadow: var(--shadow); }
.card-top { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; margin: -18px -18px 0; padding: 16px 18px 14px; border-bottom: 1px solid var(--line); }
.card.is-short .card-top { background: var(--red-soft); }
.card.is-season .card-top { background: var(--green-soft); }
.card.is-short .meta { color: #5A3A3E; }
.card h3 { margin: 0; font: 400 23px/1.15 var(--display); }
.stamp { flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 54px; padding: 6px 8px; border-radius: 10px; background: var(--red); color: var(--on-accent); line-height: 1.05; text-align: center; }
.stamp b { font: 400 24px var(--display); }
.stamp span { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.meta { margin: 0; color: var(--ink-soft); font-size: 14px; display: flex; align-items: flex-start; gap: 8px; }
.meta .flag { margin-top: 3px; }
.meta span { flex: 1 1 auto; min-width: 0; }
.flag { width: 24px; height: 16px; border-radius: 2px; box-shadow: 0 0 0 1px rgba(0,0,0,.15); flex: none; display: block; }
.when { margin: 0; font-size: 14px; }
.when strong { font-weight: 600; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { border-radius: 999px; padding: 4px 10px; font-size: 12.5px; font-weight: 600; background: var(--surface-2); color: var(--ink); }
.badge.short { background: var(--red); color: var(--on-accent); }
.badge.go { background: var(--green-soft); color: var(--green-ink); }
.badge.warn { background: var(--gold-soft); color: var(--gold-ink); }
.badge.no { background: var(--red-soft); color: var(--red-ink); }
.badge.visited { background: var(--gold-soft); color: var(--gold-ink); border: 1px solid var(--gold-ink); }
.why { margin: 0; font-size: 15px; }
.food { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.food b { display: block; color: var(--green-ink); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.addr { margin: 0; font-size: 13px; color: var(--ink-soft); }
.actions { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: auto; }
.actions .btn { padding: 8px 4px; font-size: 13.5px; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 10px 13px; border-radius: 10px; font: 600 14px var(--body); text-decoration: none; border: 1px solid var(--line); color: var(--ink); background: var(--surface); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--green); color: var(--green-ink); }
.btn.primary { background: var(--red); color: var(--on-accent); border-color: var(--red); }
.btn.primary:hover { background: var(--red-ink); color: var(--on-accent); }
.btn.green { background: var(--green); color: var(--on-accent); border-color: var(--green); }
.btn.green:hover { background: var(--green-ink); color: var(--on-accent); }
.btn:disabled { opacity: .4; cursor: default; }
.empty { color: var(--ink); background: var(--surface); border: 1px dashed var(--line); border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.empty p { margin: 0; }
.routes { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.route { color: var(--ink); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.route.past { opacity: .55; }
.route .rwhen { margin: 0; color: var(--red-ink); font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
.route h3 { margin: 0; font: 400 22px/1.15 var(--display); }
.route p { margin: 0; font-size: 15px; }
.route .stops { display: flex; flex-wrap: wrap; gap: 6px; }
.route .stop { display: inline-flex; gap: 6px; align-items: center; background: var(--surface-2); border-radius: 999px; padding: 4px 10px 4px 6px; font-size: 13px; }
.route .stop .flag { width: 18px; height: 12px; }
.route .base { color: var(--ink-soft); font-size: 14px; }
.cal-nav { display: flex; gap: 8px; }
.cal-scroll { overflow-x: auto; }
.cal { min-width: 700px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.dow { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--on-bg-soft); padding: 4px 6px; text-transform: uppercase; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px; min-height: 96px; display: flex; flex-direction: column; gap: 4px; text-align: left; color: var(--ink); font: 14px var(--body); cursor: pointer; }
.day.out { visibility: hidden; }
.day.none { opacity: .7; }
.day:hover { border-color: var(--green); }
.day[aria-pressed="true"] { border: 2px solid var(--red); background: var(--sel-bg); }
.day .n { display: flex; justify-content: space-between; font-weight: 700; font-variant-numeric: tabular-nums; }
.day .n small { font-weight: 700; color: var(--green-ink); }
.day .tag { background: var(--red-soft); color: var(--red-ink); border-radius: 5px; padding: 2px 5px; font-size: 11.5px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend { margin: 12px 0 0; color: var(--on-bg-soft); font-size: 14px; max-width: 75ch; }
.suggest { background: var(--red); color: var(--on-accent); border-radius: 20px; padding: 26px; display: flex; flex-wrap: wrap; gap: 18px 28px; align-items: center; justify-content: space-between; }
.suggest > div { display: flex; flex-direction: column; gap: 8px; max-width: 62ch; min-width: 0; }
.suggest h2 { color: var(--on-accent); }
.suggest p { margin: 0; }
.suggest .btn { background: var(--surface); border-color: var(--surface); color: var(--red-ink); font-size: 16px; padding: 14px 22px; }
footer { border-top: 1px solid var(--bg-line); }
footer .wrap { padding-block: 28px 40px; display: flex; flex-wrap: wrap; gap: 14px 24px; justify-content: space-between; align-items: flex-start; }
footer p { margin: 0; font-size: 14px; color: var(--on-bg-soft); }
footer a { color: var(--on-bg-green); }
footer b { font: 400 22px var(--display); color: var(--on-bg); }
@media (prefers-reduced-motion: no-preference) { .card, .route, .day { transition: border-color .15s; } }
</style>
</head>
<body>


<div class="ribbon" aria-hidden="true"></div>
<header class="wrap top">
  <a class="brand" href="#top"><b>The Traveling Taste</b><span>by Paula Fortkamp Frigo</span></a>
  <div class="head-right"><a class="ig" id="ig-head" target="_blank" rel="noopener">@the.traveling.taste</a>
  <div class="langs" role="group" aria-label="Language" id="langs">
    <button type="button" data-lang="en">EN</button><button type="button" data-lang="pt">PT</button><button type="button" data-lang="fr">FR</button><button type="button" data-lang="de">DE</button>
  </div></div>
</header>

<main id="top">
  <div class="wrap hero">
    <p class="eyebrow" data-t="eyebrow"></p>
    <h1 id="h1"></h1>
    <p class="lede" data-t="lede"></p>
    <div class="panel">
      <div class="quick" role="group" aria-label="When" id="quick">
        <button type="button" class="chip" data-q="today" data-t="today"></button>
        <button type="button" class="chip" data-q="weekend" data-t="weekend"></button>
        <button type="button" class="chip" data-q="nextweekend" data-t="nextweekend"></button>
      </div>
      <div class="fields">
        <div class="field"><label for="f-date" data-t="pickDate"></label><input id="f-date" type="date" min="2026-11-01" max="2027-01-31"></div>
        <div class="field"><label for="f-travel" data-t="travel"></label>
          <select id="f-travel"><option value="60"></option><option value="120"></option><option value="180" selected></option><option value="any"></option></select></div>
        <div class="field"><label for="f-country" data-t="country"></label><select id="f-country"></select></div>
      </div>
      <fieldset class="checks"><legend class="sr" data-t="filters"></legend>
        <label><input type="checkbox" id="f-short"><span data-t="fShort"></span></label>
        <label><input type="checkbox" id="f-train"><span data-t="fTrain"></span></label>
        <label><input type="checkbox" id="f-indoor"><span data-t="fIndoor"></span></label>
      </fieldset>
    </div>
  </div>

  <section class="wrap" aria-labelledby="res-h">
    <div class="sec-head"><h2 id="res-h"></h2><p class="count" id="res-count"></p></div>
    <div id="results"></div>
  </section>

  <section class="wrap" aria-labelledby="cal-h">
    <div class="sec-head"><h2 id="cal-h"></h2>
      <div class="cal-nav"><button type="button" class="btn" id="cal-prev"></button><button type="button" class="btn" id="cal-next"></button></div></div>
    <div class="cal-scroll"><div class="cal" id="cal"></div></div>
    <p class="legend" data-t="calLegend"></p>
  </section>

  <section class="wrap" aria-labelledby="rt-h">
    <div class="sec-head"><h2 id="rt-h" data-t="routesTitle"></h2><p class="count" data-t="routesSub"></p></div>
    <div class="routes" id="routes"></div>
  </section>

  <section class="wrap" aria-labelledby="sug-h">
    <div class="suggest">
      <div><h2 id="sug-h" data-t="sugTitle"></h2><p data-t="sugText"></p></div>
      <a class="btn" id="sug-btn" target="_blank" rel="noopener"></a>
    </div>
  </section>
</main>

<footer><div class="wrap">
  <div style="display:flex;flex-direction:column;gap:4px"><b>The Traveling Taste</b><p>by Paula Fortkamp Frigo · <a id="ig-foot" target="_blank" rel="noopener">@the.traveling.taste</a></p></div>
  <p style="max-width:60ch" data-t="disclaimer"></p>
</div></footer>

/* ---------- date helpers (all dates are plain YYYY-MM-DD, no time zones) ---------- */
const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const DOW = {sun:0, mon:1, tue:2, wed:3, thu:4, fri:5, sat:6};

function prep(m) {
  m.periods = String(m.open_periods || "").split(";").map(p => p.trim()).filter(Boolean).map(p => {
    const [a, b] = p.split(/\s+to\s+/); return [a, b || a];
  });
  const od = String(m.open_days || "Daily").toLowerCase();
  m.dows = od.startsWith("daily") ? null : new Set(od.split(/[,\s]+/).map(x => DOW[x.slice(0, 3)]).filter(x => x !== undefined));
  m.closed = new Set(String(m.closed_dates || "").split(";").map(s => s.trim()).filter(Boolean));
  m.first = m.periods.length ? m.periods[0][0] : "";
  m.last = m.periods.length ? m.periods[m.periods.length - 1][1] : "";
  m.travel = m.travel_min === "" || m.travel_min == null ? null : Number(m.travel_min);
  return m;
}
const DATA = MARKETS.filter(m => String(m.show_on_site || "Yes").toLowerCase() !== "no").map(prep);

function isOpen(m, day) {
  if (m.closed.has(day)) return false;
  if (m.dows && !m.dows.has(parse(day).getDay())) return false;
  return m.periods.some(([a, b]) => day >= a && day <= b);
}

/* ---------- state ---------- */
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const browserLang = (navigator.language || "en").slice(0, 2);
const state = {
  lang: T[store.get("lang")] ? store.get("lang") : (T[browserLang] ? browserLang : "en"),
  mode: "day", days: [], quick: null,
  travel: "180", country: "", short: false, train: false, indoor: false,
  month: null
};
const t = k => T[state.lang][k] ?? T.en[k] ?? k;
const loc = (m, field) => m[field + "_" + state.lang] || m[field + "_en"] || "";

function todayIso() { return iso(new Date()); }
function weekendFrom(day, skip) {
  const d = parse(day); let dow = d.getDay();
  let toSat = (6 - dow + 7) % 7; if (dow === 0) toSat = -1;   // Sunday belongs to the current weekend
  const sat = addDays(day, toSat + (skip ? 7 : 0));
  return [sat, addDays(sat, 1)];
}

function passesFilters(m) {
  if (state.travel !== "any" && (m.travel === null || m.travel > Number(state.travel))) return false;
  if (state.country && m.country !== state.country) return false;
  if (state.short && !m.short_run) return false;
  if (state.train && !String(m.by_public_transport).toLowerCase().startsWith("yes")) return false;
  if (state.indoor && String(m.indoor).toLowerCase() !== "yes") return false;
  return true;
}

/* ---------- formatting ---------- */
function fmtDay(day, opts) { return new Intl.DateTimeFormat(LOCALE[state.lang], opts).format(parse(day)); }
function fmtRange(a, b) {
  const da = parse(a), db = parse(b);
  if (a === b) return fmtDay(a, {day: "numeric", month: "short"});
  const sameMonth = da.getMonth() === db.getMonth() && da.getFullYear() === db.getFullYear();
  return (sameMonth ? fmtDay(a, {day: "numeric"}) : fmtDay(a, {day: "numeric", month: "short"})) + "–" + fmtDay(b, {day: "numeric", month: "short"});
}
function datesSummary(m) {
  let s = m.periods.map(([a, b]) => fmtRange(a, b)).join(" · ");
  if (m.dows) {
    const names = [...m.dows].sort((x, y) => ((x + 6) % 7) - ((y + 6) % 7)).map(n => new Intl.DateTimeFormat(LOCALE[state.lang], {weekday: "short"}).format(new Date(2026, 10, 1 + n)));
    s += " (" + names.join(", ") + ")";
  }
  return s;
}
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function safeUrl(u) { return /^https?:\/\//i.test(String(u || "")) ? String(u) : ""; }

/* ---------- rendering ---------- */
function setStatic() {
  document.documentElement.lang = state.lang;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll("#langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)));
  const tr = document.getElementById("f-travel");
  ["t60", "t120", "t180", "tany"].forEach((k, i) => { tr.options[i].textContent = t(k); });
  const cs = document.getElementById("f-country");
  const names = [...new Set(DATA.map(m => m.country))];
  cs.innerHTML = '<option value="">' + esc(t("allC")) + "</option>" + names.map(c => '<option value="' + esc(c) + '">' + esc((COUNTRIES[c] || {})[state.lang] || c) + "</option>").join("");
  cs.value = state.country;
  document.getElementById("cal-prev").textContent = "‹ " + t("prev");
  document.getElementById("cal-next").textContent = t("next") + " ›";
  document.getElementById("cal-h").textContent = t("calTitle");
  document.querySelector(".disclaimer, [data-t=disclaimer]").textContent = t("disclaimer") + fmtDay(UPDATED, {day: "numeric", month: "long", year: "numeric"});
  document.getElementById("ig-foot").href = INSTAGRAM_URL;
  document.getElementById("ig-head").href = INSTAGRAM_URL;
  const h1 = document.getElementById("h1"), title = t("title"), em = t("titleEm"), at = title.indexOf(em);
  h1.innerHTML = at < 0 ? esc(title) : esc(title.slice(0, at)) + "<em>" + esc(em) + "</em>" + esc(title.slice(at + em.length));
  document.querySelector("[data-t=sugText]").textContent = t("sugText2");
  const sb = document.getElementById("sug-btn");
  sb.href = FORM_URL || INSTAGRAM_URL; sb.textContent = FORM_URL ? t("sugBtn") : t("sugBtnIg");
  document.querySelectorAll("#quick button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.q === state.quick)));
}

function card(m) {
  const tags = [];
  if (m.short_run) tags.push('<span class="badge short">' + esc(T[state.lang].short[m.short_run] || m.short_run) + "</span>");
  if (state.days.length > 1) {
    const openDays = state.days.filter(d => isOpen(m, d));
    if (openDays.length < state.days.length) tags.push('<span class="badge">' + esc(openDays.map(d => fmtDay(d, {weekday: "short"})).join(", ")) + "</span>");
  }
  if (String(m.date_status).toLowerCase().startsWith("to confirm")) tags.push('<span class="badge warn">' + esc(t("tbc")) + "</span>");
  if (String(m.by_public_transport).toLowerCase().startsWith("yes")) tags.push('<span class="badge go">' + esc(t("train")) + "</span>");
  if (String(m.indoor).toLowerCase() === "yes") tags.push('<span class="badge go">' + esc(t("indoor")) + "</span>");
  if (m.tickets && !/free/i.test(m.tickets)) tags.push('<span class="badge">' + esc(t("tickets")) + ": " + esc(m.tickets.replace(/^Entry\s*/i, "")) + "</span>");
  if (String(m.dogs).toLowerCase() === "no") tags.push('<span class="badge no">' + esc(t("noDogs")) + "</span>");
  if (String(m.dogs).toLowerCase() === "yes") tags.push('<span class="badge go">' + esc(t("dogsOk")) + "</span>");
  if (String(m.paula_visited).toLowerCase() === "yes") tags.push('<span class="badge visited">' + esc(t("visited")) + "</span>");

  const country = (COUNTRIES[m.country] || {})[state.lang] || m.country;
  const travel = m.travel === null ? esc(m.travel_text) : m.travel === 0 ? "" : esc(m.travel_text) + " " + esc(t("fromLux"));
  const food = loc(m, "food");
  const link = safeUrl(m.link);
  const where = m.address ? m.address + ", " + m.town : m.town + ", " + m.country;
  const maps = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(m.address ? where : (m.lat + "," + m.lng));
  const day = state.days.find(d => isOpen(m, d)) || state.days[0];
  const gcal = "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(m.name) +
    "&dates=" + day.replace(/-/g, "") + "/" + addDays(day, 1).replace(/-/g, "") +
    "&location=" + encodeURIComponent(where) + "&details=" + encodeURIComponent((m.hours ? m.hours + "\n" : "") + (link || ""));
  const wa = "https://wa.me/?text=" + encodeURIComponent(m.name + " · " + fmtDay(day, {weekday: "long", day: "numeric", month: "long"}) + (link ? "\n" + link : ""));
  const reel = safeUrl(m.instagram_link);
  const stamp = m.short_run ? '<div class="stamp" aria-hidden="true"><b>' + parse(day).getDate() + "</b><span>" + esc(fmtDay(day, {month: "short"}).replace(".", "")) + "</span></div>" : "";
  return '<article class="card ' + (m.short_run ? "is-short" : "is-season") + '" id="m-' + esc(m.id) + '">' +
    '<div class="card-top"><div><h3>' + esc(m.name) + "</h3>" +
    '<p class="meta">' + flag(m.country) + "<span>" + esc(m.town) + " · " + esc(country) + (travel ? " · " + travel : "") + "</span></p></div>" + stamp + "</div>" +
    '<p class="when"><strong>' + esc(datesSummary(m)) + "</strong><br>" + esc(t("hours")) + ": " + esc(m.hours || t("hoursTbc")) + "</p>" +
    (tags.length ? '<div class="badges">' + tags.join("") + "</div>" : "") +
    (loc(m, "highlight") ? '<p class="why">' + esc(loc(m, "highlight")) + "</p>" : "") +
    (food ? '<div class="food"><b>' + esc(t("eat")) + "</b>" + esc(food) + "</div>" : "") +
    (m.address ? '<p class="addr">' + esc(m.address) + "</p>" : "") +
    (reel ? '<a href="' + esc(reel) + '" target="_blank" rel="noopener">' + esc(t("watch")) + "</a>" : "") +
    '<div class="actions">' +
      (link ? '<a class="btn primary" href="' + esc(link) + '" target="_blank" rel="noopener" aria-label="' + esc(m.name + ": " + t("officialLong")) + '">' + esc(t("official")) + "</a>" : "") +
      '<a class="btn" href="' + esc(gcal) + '" target="_blank" rel="noopener" aria-label="' + esc(t("calLong")) + '">' + esc(t("cal")) + "</a>" +
      '<a class="btn" href="' + esc(maps) + '" target="_blank" rel="noopener">' + esc(t("dirs")) + "</a>" +
      '<a class="btn" href="' + esc(wa) + '" target="_blank" rel="noopener" aria-label="' + esc(t("shareLong")) + '">' + esc(t("share")) + "</a>" +
    "</div></article>";
}

function openOn(days) { return DATA.filter(m => passesFilters(m) && days.some(d => isOpen(m, d))); }

function nextDayWithMarkets(from) {
  for (let i = 1; i < 120; i++) { const d = addDays(from, i); if (openOn([d]).length) return d; }
  return null;
}

function renderResults() {
  const h = document.getElementById("res-h"), c = document.getElementById("res-count"), box = document.getElementById("results");
  const days = state.days;
  h.textContent = state.mode === "weekend"
    ? t("weekendOf") + " " + fmtRange(days[0], days[days.length - 1])
    : fmtDay(days[0], {weekday: "long", day: "numeric", month: "long"});
  const list = openOn(days).sort((a, b) => (a.travel ?? 9999) - (b.travel ?? 9999) || a.name.localeCompare(b.name));
  c.textContent = list.length + " " + (list.length === 1 ? t("open1") : t("openN"));
  if (!list.length) {
    const nd = nextDayWithMarkets(days[days.length - 1]);
    box.innerHTML = '<div class="empty"><p>' + esc(t("none")) + "</p>" +
      (nd ? '<button type="button" class="btn primary" data-goto="' + nd + '">' + esc(t("nextOpen") + " " + fmtDay(nd, {weekday: "short", day: "numeric", month: "short"})) + "</button>" : "") +
      (state.travel !== "any" ? '<button type="button" class="btn" data-widen="1">' + esc(t("widen")) + "</button>" : "") + "</div>";
    return;
  }
  const shortL = list.filter(m => m.short_run), season = list.filter(m => !m.short_run);
  const group = (cls, title, sub, items) => items.length ? '<div class="group"><div class="group-h ' + cls + '"><h3>' + esc(title) + " · " + items.length + "</h3><p>" + esc(sub) + '</p></div><div class="grid">' + items.map(card).join("") + "</div></div>" : "";
  box.innerHTML = group("short", t("groupShort"), t("groupShortSub"), shortL) + group("season", t("groupSeason"), t("groupSeasonSub"), season);
}

function renderCalendar() {
  const [y, mo] = state.month;
  const cal = document.getElementById("cal");
  const first = new Date(y, mo, 1), daysIn = new Date(y, mo + 1, 0).getDate();
  const lead = (first.getDay() + 6) % 7;
  const head = Array.from({length: 7}, (_, i) => '<div class="dow">' + esc(new Intl.DateTimeFormat(LOCALE[state.lang], {weekday: "short"}).format(new Date(2026, 10, 2 + i))) + "</div>").join("");
  let cells = "";
  for (let i = 0; i < lead; i++) cells += '<div class="day out" aria-hidden="true"></div>';
  for (let d = 1; d <= daysIn; d++) {
    const day = y + "-" + pad(mo + 1) + "-" + pad(d);
    const open = openOn([day]);
    const shortOnes = open.filter(m => m.short_run).sort((a, b) => (a.travel ?? 9999) - (b.travel ?? 9999));
    const tags = shortOnes.slice(0, 2).map(m => '<span class="tag">' + esc(m.town) + "</span>").join("") +
      (shortOnes.length > 2 ? '<span class="tag">+' + (shortOnes.length - 2) + "</span>" : "");
    const sel = state.days.includes(day);
    cells += '<button type="button" class="day' + (open.length ? "" : " none") + '" data-day="' + day + '" aria-pressed="' + sel + '" aria-label="' +
      esc(fmtDay(day, {weekday: "long", day: "numeric", month: "long"}) + ": " + open.length + " " + (open.length === 1 ? t("open1") : t("openN"))) + '">' +
      '<span class="n">' + d + (open.length ? "<small>" + open.length + "</small>" : "") + "</span>" + tags + "</button>";
  }
  cal.innerHTML = head + cells;
  document.getElementById("cal-h").textContent = new Intl.DateTimeFormat(LOCALE[state.lang], {month: "long", year: "numeric"}).format(first);
  document.getElementById("cal-prev").disabled = (y === 2026 && mo <= 10);
  document.getElementById("cal-next").disabled = (y === 2027 && mo >= 0);
}

const BY_ID = Object.fromEntries(DATA.map(m => [m.id, m]));
function renderRoutes() {
  const today = todayIso();
  document.getElementById("routes").innerHTML = ROUTES.filter(r => String(r.show_on_site || "Yes").toLowerCase() !== "no").map(r => {
    const stops = String(r.markets).split(",").map(x => BY_ID[x.trim()]).filter(Boolean);
    const title = r["title_" + state.lang] || r.title_en, plan = r["plan_" + state.lang] || r.plan_en, base = r["base_" + state.lang] || r.base_en;
    return '<article class="route' + (r.end < today ? " past" : "") + '">' +
      '<p class="rwhen">' + esc(fmtRange(r.start, r.end)) + "</p><h3>" + esc(title) + "</h3><p>" + esc(plan) + "</p>" +
      '<div class="stops">' + stops.map(m => '<span class="stop">' + flag(m.country) + esc(m.town) + "</span>").join("") + "</div>" +
      (base ? '<p class="base">' + esc(base) + "</p>" : "") +
      '<div><button type="button" class="btn green" data-route="' + esc(r.id) + '">' + esc(t("seeWeekend")) + "</button></div></article>";
  }).join("");
}
function render() { setStatic(); renderResults(); renderRoutes(); renderCalendar(); }
function selectRange(a, b) {
  const days = []; for (let d = a; d <= b; d = addDays(d, 1)) days.push(d);
  state.mode = "weekend"; state.days = days; state.quick = null;
  document.getElementById("f-date").value = "";
  const d = parse(a); state.month = [d.getFullYear(), d.getMonth()];
  render();
}

function selectDay(day) {
  state.mode = "day"; state.days = [day]; state.quick = day === todayIso() ? "today" : null;
  document.getElementById("f-date").value = day;
  const d = parse(day); state.month = [d.getFullYear(), d.getMonth()];
  render();
}
function selectWeekend(skip) {
  state.mode = "weekend"; state.days = weekendFrom(todayIso(), skip); state.quick = skip ? "nextweekend" : "weekend";
  document.getElementById("f-date").value = "";
  const d = parse(state.days[0]); state.month = [d.getFullYear(), d.getMonth()];
  render();
}

/* ---------- events ---------- */
document.getElementById("langs").addEventListener("click", e => {
  const b = e.target.closest("button[data-lang]"); if (!b) return;
  state.lang = b.dataset.lang; store.set("lang", state.lang); render();
});
document.getElementById("quick").addEventListener("click", e => {
  const b = e.target.closest("button[data-q]"); if (!b) return;
  if (b.dataset.q === "today") selectDay(todayIso()); else selectWeekend(b.dataset.q === "nextweekend");
});
document.getElementById("f-date").addEventListener("change", e => { if (e.target.value) selectDay(e.target.value); });
document.getElementById("f-travel").addEventListener("change", e => { state.travel = e.target.value; render(); });
document.getElementById("f-country").addEventListener("change", e => { state.country = e.target.value; render(); });
["short", "train", "indoor"].forEach(k => document.getElementById("f-" + k).addEventListener("change", e => { state[k] = e.target.checked; render(); }));
document.getElementById("results").addEventListener("click", e => {
  const g = e.target.closest("[data-goto]"); if (g) { selectDay(g.dataset.goto); return; }
  if (e.target.closest("[data-widen]")) { state.travel = "any"; document.getElementById("f-travel").value = "any"; render(); }
});
document.getElementById("cal").addEventListener("click", e => {
  const b = e.target.closest("button[data-day]"); if (!b) return;
  selectDay(b.dataset.day);
  document.getElementById("res-h").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start"});
});
document.getElementById("routes").addEventListener("click", e => {
  const b = e.target.closest("button[data-route]"); if (!b) return;
  const r = ROUTES.find(x => x.id === b.dataset.route); if (!r) return;
  state.travel = "any"; document.getElementById("f-travel").value = "any";
  selectRange(r.start, r.end);
  document.getElementById("res-h").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start"});
});
document.getElementById("cal-prev").addEventListener("click", () => { let [y, m] = state.month; m--; if (m < 0) { m = 11; y--; } state.month = [y, m]; renderCalendar(); });
document.getElementById("cal-next").addEventListener("click", () => { let [y, m] = state.month; m++; if (m > 11) { m = 0; y++; } state.month = [y, m]; renderCalendar(); });
/* ---------- start: today if anything is open, otherwise the next day with markets ---------- */
(function start() {
  const today = todayIso();
  const firstDay = openOn([today]).length ? today : (nextDayWithMarkets(today) || today);
  selectDay(firstDay);
})();
</script>

</body></html>
